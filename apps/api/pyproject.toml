[project]
name = "leadradar"
version = "0.1.0"
description = "LeadRadar api and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.27",
  "publicsuffix2>=2.20191221",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.7",
  "mypy>=1.13",
  "poethepoet>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar"]

[project.scripts]
leadradar-api = "leadradar.api.main:run"
leadradar-worker = "leadradar.worker.main:run"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
  "unit: fast tests with no external dependency (default)",
  "integration: tests against a real PostgreSQL via testcontainers",
  "contract: tests of the api against its contracts",
]
asyncio_mode = "auto"

[tool.poe.tasks]
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
typecheck = "mypy src tests"
test-unit = "pytest -m unit --disable-socket --allow-unix-socket"
test-integration = "pytest -m integration"
test-contract = "pytest -m contract --disable-socket --allow-unix-socket"
openapi-snapshot = { script = "leadradar.api.openapi_snapshot:main" }
validate = ["format-check", "lint", "typecheck", "test-unit", "test-integration", "test-contract"]
