[project]
name = "leadradar-docs-tooling"
version = "0.1.0"
requires-python = ">=3.12"
description = "Docs bundle tooling: index builder, checker and traceability matrix generator. Imports nothing from any app."
dependencies = [
    "markdown-it-py[linkify]>=3.0.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PTH", "RET", "SIM", "UP", "W"]
